<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AOC Connect Partners</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            max-width: 1200px;
            width: 100%;
        }

        .partners {
            background: white;
            padding: 40px 20px;
            border-radius: 15px;
            text-align: center;
        }

        .partners h3 {
            margin-bottom: 30px;
            color: #212B36;
            font-size: 24px;
            font-weight: 600;
            line-height: 1.4;
        }

        .partner-logos {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 30px;
            align-items: center;
            justify-items: center;
            margin-top: 20px;
            max-width: 1000px;
            margin-left: auto;
            margin-right: auto;
        }

        .partner-logo {
            max-width: 150px;
            height: auto;
            filter: grayscale(100%);
            transition: filter 0.3s ease, transform 0.3s ease;
            border-radius: 8px;
        }

        .partner-logo:hover {
            filter: grayscale(0%);
            transform: scale(1.05);
        }

        .partner-link {
            display: block;
            text-decoration: none;
            transition: opacity 0.3s ease;
        }

        .partner-link:hover {
            opacity: 0.8;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .partner-logos {
                grid-template-columns: repeat(2, 1fr);
                gap: 20px;
            }
            
            .partners h3 {
                font-size: 20px;
                margin-bottom: 25px;
            }
            
            .partner-logo {
                max-width: 120px;
            }
        }

        @media (max-width: 480px) {
            .partner-logos {
                grid-template-columns: 1fr;
                gap: 15px;
            }
            
            .partners {
                padding: 30px 15px;
            }
            
            .partners h3 {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="partners">
            <h3>AOC Connect is proud to partner with these innovative companies</h3>
        </div>
        
        <div class="partner-logos">
            <a href="https://www.breg.com/" target="_blank" rel="noopener noreferrer" class="partner-link">
                <img src="https://members.myaocconnect.com/wp-content/uploads/aoc-breg-1.jpg" alt="Breg" class="partner-logo">
            </a>
            <a href="https://www.pacira.com/" target="_blank" rel="noopener noreferrer" class="partner-link">
                <img src="https://myaocconnect.com/wp-content/uploads/aoc-pacira-1.jpg" alt="Pacira" class="partner-logo">
            </a>
            <a href="https://www.smith-nephew.com/en-us" target="_blank" rel="noopener noreferrer" class="partner-link">
                <img src="https://myaocconnect.com/wp-content/uploads/aoc-smith-nephew-1.jpg" alt="Smith+Nephew" class="partner-logo">
            </a>
            <a href="https://thenext.jnjmedtech.com/" target="_blank" rel="noopener noreferrer" class="partner-link">
                <img src="https://members.myaocconnect.com/wp-content/uploads/aoc-johnson-and-johnson.jpg" alt="Johnson & Johnson MedTech" class="partner-logo">
            </a>
            <a href="https://socialclimb.com/" target="_blank" rel="noopener noreferrer" class="partner-link">
                <img src="https://members.myaocconnect.com/wp-content/uploads/aoc-socialclimb-1.jpg" alt="SocialClimb Healthcare Marketing Platform" class="partner-logo">
            </a>
            <a href="https://thinksurgical.com/" target="_blank" rel="noopener noreferrer" class="partner-link">
                <img src="https://members.myaocconnect.com/wp-content/uploads/aoc-Think-Surgical-e1681742874587.jpg" alt="Think Surgical" class="partner-logo">
            </a>
            <a href="https://www.herontx.com/" target="_blank" rel="noopener noreferrer" class="partner-link">
                <img src="https://myaocconnect.com/wp-content/uploads/aoc-heron.jpg" alt="Heron Therapeutics" class="partner-logo">
            </a>
            <a href="https://www.vrtx.com/home/" target="_blank" rel="noopener noreferrer" class="partner-link">
                <img src="https://myaocconnect.com/wp-content/uploads/aoc-vertex.jpg" alt="Vertex" class="partner-logo">
            </a>
        </div>
    </div>
</body>
</html>
