  <script>
    (function () {
      // Set document title
      document.title = 'Update the Data';

      // Ensure viewport meta exists
      var viewport = document.querySelector('meta[name="viewport"]');
      if (!viewport) {
        viewport = document.createElement('meta');
        viewport.name = 'viewport';
        document.head.appendChild(viewport);
      }
      viewport.content = 'width=device-width, initial-scale=1.0';

      // Inject styles
      var styleTag = document.createElement('style');
      styleTag.textContent = `
    body {
      font-family: Arial, sans-serif;
      background: #f8f9fa;
    }
    #section {
      display: none;
      max-width: 600px;
      margin: 0 auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px #0001;
      padding: 24px; 
    }
    #info {
      margin-bottom: 24px;
      text-align: center;
      color: #444;
      font-size: 1.1rem;
      padding: 24px;
    }
    .row-flex {
      display: flex;
      align-items: center;
      gap: 18px;
      width: 100%;
    }
    button {
      padding: 12px 32px;
      font-size: 1.1rem;
      border-radius: 6px;
      border: none;
      background: #1976d2;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
      min-width: 160px;
      max-width: 200px;
      text-align: center;
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    button:disabled {
      background: #90caf9;
      cursor: not-allowed;
      opacity: 0.7;
    }
    #loading {
      display: none;
      flex: 1 1 0;
      height: 54px;
      align-items: center;
    }
    .progress-bar-container {
      width: 100%;
      background: #e3f2fd;
      border-radius: 6px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .progress-bar {
      background: linear-gradient(90deg, #1976d2 0%, #64b5f6 100%);
      height: 100%;
      transition: width 0.4s;
      border-radius: 6px 0 0 6px;
      position: absolute;
      left: 0;
      top: 0;
      z-index: 1;
    }
    .progress-label {
      position: relative;
      z-index: 2;
      color: #0d47a1;
      font-size: 1.08rem;
      width: 100%;
      text-align: center;
      font-weight: bold;
      letter-spacing: 0.5px;
      word-break: break-word;
    }
    @media (max-width: 600px) {
      #section {
        padding: 0 6px;
      }
      .row-flex {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
      }
      button, #loading, .progress-bar-container {
        width: 100%;
        min-width: 0;
        max-width: 100%;
        height: 44px;
      }
      .progress-label {
        font-size: 0.98rem;
      }
    }
      `;
      document.head.appendChild(styleTag);

      // Inject markup
      var container = document.createElement('div');
      container.innerHTML = `
  <div id="section">
    <div id="info"></div>
    <div class="row-flex">
      <button id="btnSend" disabled>Loading...</button>
      <div id="loading">
        <div class="progress-bar-container">
          <div id="progress-bar" class="progress-bar" style="width:0%"></div>
          <div id="progress-label" class="progress-label">Prepping to send...</div>
        </div>
      </div>
    </div>
  </div>`;
      while (container.firstChild) document.body.appendChild(container.firstChild);

      // Logic
      var missingDates = [];
      var sending = false;

      async function getMissingDates() {
        try {
          const response = await fetch('https://n8ndev.coconutbreeze.app/webhook/87ddfee9-5efe-4d33-882c-4ca9eca8c530', {
            method: 'GET'
          });
          if (response.ok) {
            const data = await response.json();
            missingDates = data.missing_dates || [];
            if (missingDates.length > 0) {
              document.getElementById('section').style.display = 'block';
              document.getElementById('info').innerHTML = `
              <p>Missing dates found: <strong>${missingDates.length}</strong></p>
              <p>Most recent date: <strong>${data.most_recent_date || 'N/A'}</strong></p>
            `;
              document.getElementById('btnSend').disabled = false;
              document.getElementById('btnSend').textContent = `Update with ${missingDates.length} dates`;
            } else {
              document.getElementById('section').style.display = 'none';
            }
          } else {
            alert('Error getting missing dates');
          }
        } catch (error) {
          alert('Network error getting dates');
          console.error(error);
        }
      }

      async function sendDates() {
        if (sending || missingDates.length === 0) return;
        sending = true;
        document.getElementById('btnSend').disabled = true;
        document.getElementById('loading').style.display = 'flex';

        const total = missingDates.length;
        let sent = 0;
        let errors = 0;

        updateProgressBar(0, total, 'Updating...');

        for (let i = 0; i < missingDates.length; i++) {
          const date = missingDates[i];
          const [mm, dd, yyyy] = date.split('/');
          const formattedDate = `${yyyy}${mm}${dd}`;

          try {
            const response = await fetch('https://n8n.coconutbreeze.app/webhook/updateroutemanagerdata', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({ fecha: formattedDate })
            });

            if (response.ok) {
              const responseText = await response.text();
              sent++;
              if (responseText.trim().toLowerCase() !== 'done') {
                console.log(`Unexpected response for date ${date}: ${responseText}`);
              }
            } else {
              errors++;
            }
          } catch (error) {
            errors++;
            console.error(`Error sending date ${date}:`, error);
          }

          const progress = ((i + 1) / total) * 100;
          updateProgressBar(i + 1, total, 'Updating...');
        }

        updateProgressBar(total, total, `
        <strong>Process completed:</strong><br>
        Sent successfully: ${sent}<br>
        ${errors > 0 ? `Errors: ${errors}<br>` : ''}
        Total processed: ${total}
      `, true);

        sending = false;
        document.getElementById('btnSend').style.display = 'none';
        setTimeout(() => {
          document.getElementById('section').style.display = 'none';
        }, 2000);
      }

      function updateProgressBar(current, total, label, completed = false) {
        const percent = Math.round((current / total) * 100);
        const bar = document.getElementById('progress-bar');
        const labelDiv = document.getElementById('progress-label');
        bar.style.width = completed ? '100%' : percent + '%';
        labelDiv.innerHTML = label;
      }

      function init() {
        document.getElementById('btnSend').onclick = sendDates;
        getMissingDates();
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
