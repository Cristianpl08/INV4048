<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            margin: 0;
            background: white; 
        }
        #container {
            width: 100%;
            height: 0; 
        }
    </style>
</head>
<body>

 Take a look at our new website: <a href="https://myaocconnect.com/" target="_blank">https://myaocconnect.com/</a>
    <div id="container"></div>

    <script>
        const url = "https://myaocconnect.com/";
        const container = document.getElementById("container");

        fetch(url, {method: "HEAD", mode: "no-cors"})
            .then(() => {
    
                const iframe = document.createElement("iframe");
                iframe.src = url;
                iframe.width = "100%";
                iframe.height = "1000px";
                iframe.frameBorder = "0";

                container.style.height = "1000px";
                container.appendChild(iframe);
            })
            .catch(() => {
                
                container.style.display = "none";
            });
    </script>
</body>
</html>
